upstream sentinel_core {
    server core:8000;
}

upstream sentinel_ingest {
    server ingest:8000;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 256k;

    # Proxy the approved Core API routes under the same browser origin.
    location /api/ {
        proxy_pass http://sentinel_core;
        proxy_http_version 1.1;
        # $http_host keeps the port so the same-origin check in the Core API
        # can compare the browser origin with the request host exactly.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health/ {
        proxy_pass http://sentinel_core;
        proxy_set_header Host $http_host;
    }

    # The ingestion endpoint is exposed on the same origin but requires the
    # source credential; it is never reachable without one.
    location /ingest/ {
        proxy_pass http://sentinel_ingest;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The single page application handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
